<header class="w-full bg-white border-b border-slate-200">
  <div class="flex w-full items-center justify-between gap-4 py-4 px-4">
    <div class="flex items-center gap-3 pl-4">
      <div>
        <div class="text-lg font-semibold text-slate-900">ContractIQ</div>
        <div class="text-xs text-slate-500">AI-Powered Document Intelligence</div>
      </div>
    </div>

    <div class="flex items-center gap-4 pr-4">
      @if (section() === 'chat') {
        <button
          type="button"
          (click)="onBackClick()"
          class="ml-2 inline-flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 bg-white text-slate-700 hover:bg-slate-50"
          aria-label="Back to Documents"
        >
          <span aria-hidden="true">←</span>
        </button>
      }
    </div>
  </div>
</header>
